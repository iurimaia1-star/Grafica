<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Acompanhe seu pedido</title>
<style>
:root{
  --brand:#2563eb; --brand-soft:rgba(37,99,235,.14); --brand-ink:#fff;
  --paper:#f6f7f9; --sheet:#ffffff; --ink:#18212f; --ink-2:#4b5666; --rule:#dfe3ea; --todo:#c4cad4;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#11151c; --sheet:#1a2029; --ink:#eef1f5; --ink-2:#a4adbb; --rule:#2c3441; --todo:#47505e; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
.top{display:flex;align-items:center;gap:12px;min-height:52px;margin-bottom:18px}
.top img{max-height:48px;max-width:160px;object-fit:contain;display:block}
.top .co{font-weight:700;font-size:17px}
.preview{background:#fff6dc;color:#6b4a00;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}

/* Bloco principal com marcas de corte, como uma folha pronta para refilar */
.hero{position:relative;background:var(--sheet);padding:26px 22px 22px;margin:10px 0 26px;border-radius:4px}
.crop{position:absolute;width:14px;height:14px;border-color:var(--brand);border-style:solid;border-width:0}
.crop.tl{top:-7px;left:-7px;border-top-width:2px;border-left-width:2px}
.crop.tr{top:-7px;right:-7px;border-top-width:2px;border-right-width:2px}
.crop.bl{bottom:-7px;left:-7px;border-bottom-width:2px;border-left-width:2px}
.crop.br{bottom:-7px;right:-7px;border-bottom-width:2px;border-right-width:2px}
.hello{margin:0;color:var(--ink-2);font-size:15px}
.num{margin:2px 0 0;font-size:15px;color:var(--ink-2)}
.num b{color:var(--ink);letter-spacing:.02em}
.hero h1{margin:18px 0 6px;font-size:clamp(30px,8vw,40px);line-height:1.08;font-weight:800;letter-spacing:-.02em;color:var(--brand)}
.lead{margin:0;color:var(--ink);max-width:42ch}
.eta{margin-top:20px;padding-top:16px;border-top:1px dashed var(--rule);display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
.eta span{color:var(--ink-2);font-size:14px}
.eta strong{font-size:18px}

h2{font-size:17px;margin:0 0 14px}
section.block{margin-bottom:28px}

/* Linha do tempo */
.line{list-style:none;margin:0;padding:0}
.st{display:grid;grid-template-columns:30px 1fr;column-gap:14px;position:relative;padding-bottom:20px}
.st:last-child{padding-bottom:0}
.st:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--rule)}
.st.done:not(:last-child)::before{background:var(--brand)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--todo);background:var(--paper);display:grid;place-items:center;position:relative;z-index:1}
.dot svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.now .dot{border-color:var(--brand);box-shadow:0 0 0 6px var(--brand-soft)}
.now .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--brand);animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.1);opacity:1}}
@media (prefers-reduced-motion: reduce){.now .dot::after{animation:none}}
.st .t{font-weight:600;padding-top:3px}
.todo .t{color:var(--ink-2);font-weight:500}
.now .t{color:var(--brand);font-weight:800}
.st .d{font-size:14px;color:var(--ink-2)}

/* Produtos */
.items{list-style:none;margin:0;padding:0;background:var(--sheet);border-radius:4px}
.items li{padding:14px 16px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:2px 14px}
.items li:last-child{border-bottom:0}
.items .n{font-weight:600}
.items .q{font-weight:700;white-space:nowrap;text-align:right}
.items .x{grid-column:1/-1;font-size:14px;color:var(--ink-2)}

.help{background:var(--sheet);border-radius:4px;padding:18px 16px}
.help p{margin:0 0 12px;color:var(--ink-2)}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border-radius:10px;background:#1f9d55;color:#fff;font-weight:700;text-decoration:none;font-size:16px}
.wa:focus-visible,.retry:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.wa svg{width:22px;height:22px;fill:currentColor}
.addr{margin-top:12px;font-size:14px;color:var(--ink-2)}
.foot{margin-top:26px;text-align:center;font-size:13px;color:var(--ink-2)}

.state{background:var(--sheet);border-radius:4px;padding:30px 22px;text-align:center;margin-top:20px}
.state h1{font-size:22px;margin:0 0 8px}
.state p{margin:0;color:var(--ink-2)}
.retry{margin-top:16px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.sk{height:14px;border-radius:7px;background:var(--rule);margin:10px auto;max-width:70%}
.sk.big{height:30px;max-width:85%}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite">
  <div class="state"><div class="sk"></div><div class="sk big"></div><div class="sk"></div><p style="margin-top:14px">Carregando seu pedido…</p></div>
</main>
<script>
'use strict';
var CFG = {url: "https://mtnsgsnvxfufzhrefxje.supabase.co", key: "sb_publishable_Sk69Nqa85lNon2Uz3MQfTw_rmx6SbPl"};
var PREVIEW = null;

var STEPS = [
  {k:'aguardando', t:'Pedido recebido', d:'Recebemos seu pedido e ele está na fila para começar a ser produzido.'},
  {k:'producao',   t:'Em produção', d:'Seu material está sendo produzido agora.'},
  {k:'acabamento', t:'Em acabamento', d:'Estamos cuidando dos detalhes finais: corte, montagem e conferência.'},
  {k:'retirada',   t:'Pronto para retirada ou entrega', d:'Seu pedido está pronto! Já pode ser retirado ou está aguardando a entrega.'},
  {k:'concluido',  t:'Finalizado e entregue', d:'Pedido entregue. Obrigado pela preferência!'}
];
var NOW_TITLE = {aguardando:'Aguardando produção', producao:'Em produção', acabamento:'Em acabamento', retirada:'Pronto para retirada ou entrega', concluido:'Pedido entregue'};
var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var WA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';

var app = document.getElementById('app');
var brand = null, timer = null, lastOk = null, failures = 0;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function digits(s){ return String(s || '').replace(/\D/g, ''); }
function pad(n){ return String(n).padStart(2, '0'); }
function dmy(iso){ if (!iso) return ''; var p = String(iso).slice(0,10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function longDate(iso){
  if (!iso) return '';
  var p = String(iso).slice(0,10).split('-').map(Number), d = new Date(p[0], p[1]-1, p[2]);
  try { return d.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}); } catch (e) { return dmy(iso); }
}
function stamp(iso){
  var d = new Date(iso); if (isNaN(d)) return '';
  return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + ' às ' + pad(d.getHours()) + 'h' + pad(d.getMinutes());
}
function hexToRgb(h){ var m = /^#([0-9a-f]{6})$/i.exec(h || ''); if (!m) return null; var n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function applyBrand(b){
  brand = b || {};
  var rgb = hexToRgb(brand.cor);
  if (rgb) {
    var r = document.documentElement.style;
    r.setProperty('--brand', brand.cor);
    r.setProperty('--brand-soft', 'rgba(' + rgb.join(',') + ',.16)');
    var lum = (0.299*rgb[0] + 0.587*rgb[1] + 0.114*rgb[2]) / 255;
    r.setProperty('--brand-ink', lum > 0.62 ? '#18212f' : '#ffffff');
  }
}

function getToken(){
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var q = new URLSearchParams(location.search);
  return (h.get('p') || q.get('p') || '').trim();
}

function rpc(fn, body){
  var headers = {'Content-Type':'application/json', 'apikey': CFG.key};
  if (CFG.key.indexOf('eyJ') === 0) headers.Authorization = 'Bearer ' + CFG.key;
  return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {method:'POST', headers: headers, body: JSON.stringify(body || {}), cache:'no-store'})
    .then(function(r){ if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; } return r.text(); })
    .then(function(t){ return t ? JSON.parse(t) : null; });
}

function header(){
  var b = brand || {};
  var logo = b.logo && /^data:image\//.test(b.logo) ? '<img src="' + esc(b.logo) + '" alt="' + esc(b.nome || '') + '">' : '';
  return '<header class="top">' + (logo || '<span class="co">' + esc(b.nome || '') + '</span>') + '</header>';
}

function renderState(title, text, retry){
  app.innerHTML = header() + '<div class="state"><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p>' +
    (retry ? '<button class="retry" type="button" id="retry">Tentar de novo</button>' : '') + '</div>';
  var b = document.getElementById('retry'); if (b) b.onclick = function(){ load(true); };
}

function render(p, isPreview){
  var idx = Math.max(0, STEPS.findIndex(function(s){ return s.k === p.status; }));
  var cur = STEPS[idx], finished = p.status === 'concluido';
  var first = String(p.cliente || '').trim().split(/\s+/)[0] || '';
  var et = p.etapas || {};
  document.title = 'Pedido ' + p.pedido + (brand && brand.nome ? ' – ' + brand.nome : '');

  var line = STEPS.map(function(s, i){
    var cls = i < idx || finished ? 'done' : i === idx ? 'now' : 'todo';
    var when = et[s.k] && cls !== 'todo' ? stamp(et[s.k]) : '';
    var sub = cls === 'now' ? 'Etapa atual' + (when ? ' desde ' + when : '') : cls === 'done' ? (when ? 'Concluído em ' + when : 'Concluído') : 'Próxima etapa';
    if (finished && i === idx) sub = when ? 'Em ' + when : 'Concluído';
    return '<li class="st ' + (finished && i === idx ? 'done' : cls) + '"' + (cls === 'now' ? ' aria-current="step"' : '') + '><span class="dot">' + (cls === 'done' || (finished && i === idx) ? CHECK : '') + '</span>' +
      '<div><div class="t">' + esc(s.t) + '</div><div class="d">' + esc(sub) + '</div></div></li>';
  }).join('');

  var items = (p.itens || []).map(function(it){
    var extra = [it.medidas, it.desc].filter(Boolean).map(esc).join('<br>');
    return '<li><span class="n">' + esc(it.nome) + '</span><span class="q">' + esc(it.qtd) + (Number(it.qtd) === 1 ? ' unidade' : ' unidades') + '</span>' +
      (extra ? '<span class="x">' + extra + '</span>' : '') + '</li>';
  }).join('');

  var eta = finished
    ? '<div class="eta"><span>Entregue em</span><strong>' + esc(longDate(p.concluidoEm || '') || dmy(p.concluidoEm)) + '</strong></div>'
    : p.prazo ? '<div class="eta"><span>Previsão de entrega</span><strong>' + esc(longDate(p.prazo)) + '</strong></div>' : '';

  var b = brand || {}, ph = digits(b.telefone);
  if (ph && ph.length <= 11) ph = '55' + ph;
  var wa = ph ? '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/' + ph + '?text=' + encodeURIComponent('Olá! Tenho uma dúvida sobre o pedido ' + p.pedido + '.') + '">' + WA + 'Falar com a gráfica no WhatsApp</a>' : '';
  var help = (wa || b.endereco) ? '<section class="block help"><h2>Ficou com alguma dúvida?</h2><p>É só chamar a gente informando o número do pedido.</p>' + wa +
    (b.endereco ? '<div class="addr">Endereço para retirada: ' + esc(b.endereco) + '</div>' : '') + '</section>' : '';

  app.innerHTML = header() +
    (isPreview ? '<div class="preview">Pré-visualização. É assim que o cliente verá a página deste pedido.</div>' : '') +
    '<section class="hero"><i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>' +
      '<p class="hello">Olá' + (first ? ', ' + esc(first) : '') + '!</p>' +
      '<p class="num">Pedido <b>' + esc(p.pedido) + '</b>' + (p.cliente ? ' de ' + esc(p.cliente) : '') + '</p>' +
      '<h1>' + esc(NOW_TITLE[cur.k] || cur.t) + '</h1><p class="lead">' + esc(cur.d) + '</p>' + eta +
    '</section>' +
    '<section class="block"><h2>Etapas do pedido</h2><ol class="line">' + line + '</ol></section>' +
    (items ? '<section class="block"><h2>O que você contratou</h2><ul class="items">' + items + '</ul></section>' : '') +
    help +
    '<p class="foot">' + (isPreview ? 'Esta página se atualiza sozinha quando a gráfica muda a etapa do pedido.' :
      'Esta página se atualiza sozinha.' + (lastOk ? ' Última verificação às ' + pad(lastOk.getHours()) + 'h' + pad(lastOk.getMinutes()) + '.' : '')) +
      (b.nome ? '<br>' + esc(b.nome) : '') + '</p>';
}

var current = null;
function load(manual){
  var token = getToken();
  if (!/^[A-Za-z0-9_-]{24,}$/.test(token)) { renderState('Link incompleto', 'Abra o link exatamente como foi enviado pela gráfica. Se o problema continuar, peça um novo link.', false); return; }
  var jobs = [rpc('ver_pedido', {p_token: token})];
  if (!brand) jobs.push(rpc('ver_marca').catch(function(){ return {}; }));
  Promise.all(jobs).then(function(res){
    if (res.length > 1) applyBrand(res[1] || {});
    failures = 0; lastOk = new Date();
    if (!res[0]) { renderState('Pedido não encontrado', 'Este link não está mais ativo. Fale com a gráfica para receber o link atualizado do seu pedido.', false); return; }
    current = res[0]; render(current, false);
  }).catch(function(){
    failures++;
    if (current && !manual) return; // mantém a última informação na tela e tenta de novo depois
    renderState('Não foi possível carregar', 'Confira sua conexão com a internet e tente de novo.', true);
  });
}
function schedule(){
  clearInterval(timer);
  timer = setInterval(function(){ if (document.visibilityState === 'visible') load(false); }, 30000);
}

if (PREVIEW) {
  applyBrand(PREVIEW.marca);
  render(PREVIEW.pedido, true);
} else if (!/^https:\/\//.test(CFG.url) || !CFG.key || CFG.key.indexOf('__') === 0) {
  renderState('Página não configurada', 'Gere esta página novamente em Configurações do sistema da gráfica.', false);
} else {
  load(true); schedule();
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') load(false); });
  window.addEventListener('hashchange', function(){ current = null; load(true); });
}
</script>
</body>
</html>
